<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 2 · TechStream</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:     #030508;
            --surf:   #0c0f16;
            --surf2:  #131825;
            --surf3:  #1b2030;
            --bdr:    #1e2336;
            --bdr2:   #2a3050;
            --acc:    #6c63ff;
            --acc-d:  rgba(108,99,255,0.13);
            --cyn:    #00d4ff;
            --cyn-d:  rgba(0,212,255,0.13);
            --cyn-g:  rgba(0,212,255,0.3);
            --txt:    #e2e5f0;
            --txts:   #8b90a7;
            --txtd:   #636882;
            --ffd:    'Rajdhani', sans-serif;
            --ff:     'Sora', sans-serif;
            --t:      0.18s;
            --ease:   cubic-bezier(0.2,1,0.3,1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg);
            color: var(--txt);
            font-family: var(--ff);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Scanline sutil */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.015) 3px, rgba(0,0,0,0.015) 4px);
            pointer-events: none;
            z-index: 9999;
        }

        /* ── NAVBAR ── */
        nav {
            background: rgba(6,8,16,0.92);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            height: 58px;
            display: flex;
            align-items: center;
            padding: 0 5%;
            z-index: 1000;
            border-bottom: 1px solid var(--bdr);
        }
        .logo {
            font-family: var(--ffd);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--txt);
            text-decoration: none;
        }
        .logo span { color: var(--cyn); }
        .nav-badge {
            margin-left: 14px;
            background: var(--acc-d);
            color: var(--acc);
            border: 1px solid rgba(108,99,255,0.25);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* ── HERO ── */
        .hero {
            position: relative;
            width: 100%;
            height: 80vh;
            display: flex;
            align-items: center;
            padding: 0 5%;
            overflow: hidden;
        }
        .hero-video-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .hero-video-bg iframe {
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .hero-overlay {
            position: absolute; inset: 0; z-index: 1;
            background:
                linear-gradient(75deg, rgba(3,5,8,0.96) 20%, transparent 60%),
                linear-gradient(to top, var(--bg) 5%, transparent 30%),
                linear-gradient(to bottom, rgba(3,5,8,0.4) 0%, transparent 20%);
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 580px;
        }
        .hero-eyebrow {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--acc);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hero-eyebrow::before {
            content: '';
            width: 24px; height: 2px;
            background: var(--acc);
        }
        .hero-content h1 {
            font-family: var(--ffd);
            font-size: 4rem;
            font-weight: 700;
            line-height: 0.92;
            margin-bottom: 18px;
            color: var(--txt);
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .hero-content h1 span { color: var(--cyn); }
        .hero-content p {
            font-size: 13px;
            color: var(--txts);
            margin-bottom: 24px;
            line-height: 1.65;
            max-width: 420px;
        }
        .btn-play {
            background: var(--acc);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-family: var(--ff);
            font-weight: 700;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all var(--t) var(--ease);
        }
        .btn-play:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108,99,255,0.4);
        }
        .play-icon {
            width: 0; height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 10px solid #fff;
        }

        /* ── SHELVES ── */
        .content-area { padding-bottom: 40px; }

        .shelf {
            padding: 36px 0 0 5%;
        }
        .shelf-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            padding-right: 5%;
        }
        .shelf-header h2 {
            font-family: var(--ffd);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--txt);
        }
        .shelf-line {
            flex: 1;
            height: 1px;
            background: var(--bdr);
        }
        .shelf-tag {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--acc);
            background: var(--acc-d);
            border: 1px solid rgba(108,99,255,0.2);
            border-radius: 20px;
            padding: 2px 9px;
        }

        .carousel {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 6px 0 24px;
            scrollbar-width: none;
        }
        .carousel::-webkit-scrollbar { display: none; }

        .card {
            flex: 0 0 auto;
            width: 260px;
            aspect-ratio: 16/9;
            background: var(--surf);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.35s var(--ease);
            border: 1px solid var(--bdr);
            position: relative;
        }
        .card:hover {
            transform: scale(1.08);
            z-index: 20;
            border-color: var(--cyn);
            box-shadow: 0 0 24px var(--cyn-g);
        }
        .card img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-title {
            position: absolute;
            bottom: 0; width: 100%;
            background: linear-gradient(transparent, rgba(3,5,8,0.96));
            padding: 18px 10px 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--txt);
            line-height: 1.3;
        }
        .card-play {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 36px; height: 36px;
            background: rgba(108,99,255,0.9);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s var(--ease);
        }
        .card-play::after {
            content: '';
            width: 0; height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 9px solid #fff;
            margin-left: 2px;
        }
        .card:hover .card-play { transform: translate(-50%, -50%) scale(1); }

        /* ── MODAL VIDEO ── */
        #video-modal {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.93);
            z-index: 5000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(12px);
        }
        #video-modal.open { display: flex; }
        .modal-box {
            background: var(--surf);
            border: 1px solid var(--acc);
            padding: 14px;
            border-radius: 16px;
            width: 92%;
            max-width: 960px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(108,99,255,0.2);
            animation: fadeUp 0.3s var(--ease) both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .modal-close {
            position: absolute; top: -42px; right: 0;
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 7px 16px;
            border-radius: 8px;
            font-family: var(--ff);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--t);
        }
        .modal-close:hover { background: #ff4757; border-color: #ff4757; }
        #modal-title {
            margin-top: 12px;
            font-family: var(--ffd);
            font-size: 1rem;
            color: var(--cyn);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav>
        <a href="#" class="logo">TECH<span>STREAM</span></a>
        <span class="nav-badge">PRÁCTICA 2</span>
    </nav>

    <!-- HERO -->
    <header class="hero">
        <div class="hero-video-bg">
            <iframe
                src="https://www.youtube.com/embed/4otj4TZmOZs?autoplay=1&mute=1&controls=0&loop=1&playlist=4otj4TZmOZs"
                frameborder="0"
                title="Hero video">
            </iframe>
        </div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-eyebrow">Plataforma de Streaming</div>
            <h1>EL ARTE DEL<br><span>HARDWARE</span></h1>
            <p>Aprende mantenimiento profesional, diagnósticos avanzados y los unboxings más exclusivos del mundo tecnológico.</p>
            <button class="btn-play" onclick="openVideo('4otj4TZmOZs', 'Guía de Montaje 2024')">
                <span class="play-icon"></span> Reproducir ahora
            </button>
        </div>
    </header>

    <!-- CARRUSELES -->
    <main class="content-area" id="content">

        <section class="shelf">
            <div class="shelf-header">
                <h2>Mantenimiento &amp; Reparación</h2>
                <div class="shelf-line"></div>
                <span class="shelf-tag">Hardware</span>
            </div>
            <div class="carousel" id="repair-carousel"></div>
        </section>

        <section class="shelf">
            <div class="shelf-header">
                <h2>Unboxings &amp; Reviews</h2>
                <div class="shelf-line"></div>
                <span class="shelf-tag">Reviews</span>
            </div>
            <div class="carousel" id="unbox-carousel"></div>
        </section>

        <section class="shelf">
            <div class="shelf-header">
                <h2>PC Builds &amp; Setups</h2>
                <div class="shelf-line"></div>
                <span class="shelf-tag">Builds</span>
            </div>
            <div class="carousel" id="builds-carousel"></div>
        </section>

    </main>

    <!-- MODAL -->
    <div id="video-modal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeVideo()">CERRAR &nbsp;✕</button>
            <div id="modal-video-container" style="width:100%; aspect-ratio:16/9;"></div>
            <div id="modal-title"></div>
        </div>
    </div>

    <script>
        const vids = {
            'repair-carousel': [
                { id: "BCnQGgctQ_Y", title: "Mantenimiento Preventivo" },
                { id: "ffdQHGXU9Do", title: "Solución Energía Estática" },
                { id: "IimIsW4S_vs", title: "Diagnóstico PC no Prende" },
                { id: "df6Wk4fru2Q", title: "PC enciende sin imagen" },
                { id: "UCYTf3M4Y54", title: "Reparación Placa Base" },
                { id: "T63afU5E3gg", title: "Limpieza Hardware" }
            ],
            'unbox-carousel': [
                { id: "37rasBhG7B4", title: "Review Wooting 60HE" },
                { id: "N_psXRtVgAQ", title: "Custom Nate Gentile" },
                { id: "-fTogZgBXwE", title: "RTX 4090 ROG Strix" },
                { id: "nYS9LVRUYKA", title: "Switches Premium" },
                { id: "olimrm09A0E", title: "Monitor OLED 4K" },
                { id: "xnWSooaspgU", title: "Intel vs AMD 2025" }
            ],
            'builds-carousel': [
                { id: "4otj4TZmOZs", title: "Guía de Montaje Paso a Paso" },
                { id: "PXaLc9AYIcg", title: "Enfriamiento Líquido Custom" },
                { id: "bP03AKVA1i0", title: "RTX 4090 Founders Edition" },
                { id: "WigYb5NtUyM", title: "ARMANDO mi nueva computadora GAMER - 2026" },
                { id: "E8IDX7eIkiE", title: "Unboxing PNY RTX 3060 XLR8" },
                { id: "zuJkKl-ZbkY", title: "PC Gamer De $50 USD VS PC Gamer De $5,000 USD" }
            ]
        };

        function init() {
            for (let id in vids) {
                const container = document.getElementById(id);
                vids[id].forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt="${v.title}" loading="lazy">
                        <div class="card-play"></div>
                        <div class="card-title">${v.title}</div>
                    `;
                    card.onclick = () => openVideo(v.id, v.title);
                    container.appendChild(card);
                });
            }
        }

        function openVideo(id, title) {
            const modal = document.getElementById('video-modal');
            modal.classList.add('open');
            document.getElementById('modal-video-container').innerHTML =
                `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;
            document.getElementById('modal-title').innerText = title;
            document.body.style.overflow = 'hidden';
        }

        function closeVideo() {
            document.getElementById('video-modal').classList.remove('open');
            document.getElementById('modal-video-container').innerHTML = '';
            document.body.style.overflow = '';
        }

        document.getElementById('video-modal').addEventListener('click', e => {
            if (e.target === document.getElementById('video-modal')) closeVideo();
        });

        init();
    </script>
</body>
</html>
